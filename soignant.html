<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12332F">
<title>Santé 31 — vue soignant</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css?v=3">
<style>
  /* Ajouts propres à la vue soignant — n'affecte pas styles.css ni le parcours patient */
  #filtres{background:var(--papier-haut);border:1.5px solid var(--trait);border-radius:var(--r);padding:14px 16px;margin-bottom:18px}
  #filtres h2{margin:0 0 10px;font-size:16px}
  .rangee{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .rangee:last-child{margin-bottom:0}
  .puce{
    font:inherit;font-size:14px;font-weight:600;padding:7px 12px;border-radius:999px;
    border:1.5px solid var(--trait);background:var(--papier);color:var(--encre);cursor:pointer;
  }
  .puce.actif{background:var(--encre);border-color:var(--encre);color:#fff}
  select#recherche-texte,input#recherche-texte{
    width:100%;padding:9px 10px;border:1.5px solid var(--trait);border-radius:10px;font:inherit;font-size:15px;
  }
  select.puce-select{font:inherit;font-size:14px;font-weight:600;padding:7px 10px;border-radius:10px;border:1.5px solid var(--trait);background:#fff;color:var(--encre)}
  .badge{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;margin-inline-start:8px;vertical-align:middle}
  .badge.ok{background:#E4F0EA;color:#2C6B51}
  .badge.warn{background:var(--ambre-clair);color:#8A5A08}
  .compte{color:var(--encre-doux);font-size:14px;margin:0 0 14px}
  .carte .note-int{margin-top:10px;font-size:14px;color:var(--encre)}
  .carte .tel-ligne{font-size:15px;font-weight:700;margin-top:2px}
  .mode-bar{margin-bottom:18px}
  #mode-guide{display:none}
  #mode-guide.actif{display:block}
  #mode-direct.masque{display:none}
  .question-carte{background:var(--papier-haut);border:1.5px solid var(--trait);border-radius:var(--r);padding:18px 16px;margin-bottom:18px}
  .question-carte h2{margin:0 0 14px;font-size:18px}
  .question-choix{display:flex;flex-direction:column;gap:8px}
  .question-choix button{
    text-align:start;font:inherit;font-size:15px;font-weight:600;
    padding:12px 14px;border-radius:10px;border:1.5px solid var(--trait);background:var(--papier);color:var(--encre);cursor:pointer;
  }
  .question-choix button:active{border-color:var(--ambre);background:var(--ambre-clair)}
  .fil-etapes{font-size:13px;color:var(--encre-doux);margin-bottom:10px}
  .fil-etapes button{background:none;border:0;color:var(--sauge);font-weight:700;cursor:pointer;padding:0;font:inherit}
  #lexique-btn{margin-inline-start:auto}
  .lex-groupe h3{font-size:15px;margin:18px 0 8px;color:var(--sauge)}
  .lex-groupe h3:first-child{margin-top:0}
  .lex-item{padding:10px 0;border-bottom:1px solid var(--trait)}
  .lex-item:last-child{border-bottom:0}
  .lex-item .terme{font-weight:700;font-size:15px}
  .lex-item .def{font-size:14px;color:var(--encre-doux);margin-top:2px}
  .lex-item .att{display:inline-block;margin-top:4px;font-size:12px;font-weight:700;color:#8A5A08}
  #lex-recherche{margin-bottom:14px}
</style>
</head>
<body>

<header id="topbar">
  <span id="crumb">Santé 31 — vue soignant</span>
  <button id="lexique-btn" class="icon-btn" aria-label="Lexique" title="Lexique">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h13a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3V4z"/><path d="M4 17a3 3 0 0 1 3-3h13"/></svg>
  </button>
</header>

<main id="app" style="padding-bottom:40px">
  <p class="sub">Le même annuaire que l'appli patient, en français, pour préparer une orientation pendant l'entretien. Rien n'est enregistré ni transmis : tout reste dans cette page.</p>

  <div class="rangee mode-bar">
    <button class="puce mode-btn actif" data-mode="direct">Filtres directs</button>
    <button class="puce mode-btn" data-mode="guide">Questionnaire guidé</button>
  </div>

  <div id="mode-direct">
    <div id="filtres">
      <h2>Besoin</h2>
      <div class="rangee" id="rangee-besoins"></div>

      <h2>Zone / âge / couverture</h2>
      <div class="rangee">
        <select id="f-zone" class="puce-select">
          <option value="">Toutes zones</option>
          <option value="toulouse">Toulouse</option>
          <option value="agglo">Agglomération</option>
          <option value="muret">Muret</option>
          <option value="comminges">Comminges</option>
          <option value="lauragais">Lauragais</option>
        </select>
        <select id="f-age" class="puce-select">
          <option value="">Tout âge</option>
          <option value="a">0-6 ans</option>
          <option value="b">7-17 ans</option>
          <option value="c">18-59 ans</option>
          <option value="d">60 ans et plus</option>
        </select>
        <select id="f-droits" class="puce-select">
          <option value="">Couverture : indifférent</option>
          <option value="oui">A des droits ouverts</option>
          <option value="encours">Demande en cours</option>
          <option value="non">Sans couverture</option>
        </select>
      </div>

      <h2>Recherche libre</h2>
      <div class="rangee">
        <input type="text" id="recherche-texte" placeholder="Nom, quartier, mot-clé…">
      </div>

      <div class="rangee" style="margin-top:4px">
        <label style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--encre-doux)">
          <input type="checkbox" id="f-nonverifie" checked>
          Inclure les fiches non vérifiées
        </label>
      </div>
    </div>
  </div>

  <div id="mode-guide">
    <div class="fil-etapes" id="fil-etapes"></div>
    <div class="question-carte" id="question-carte"></div>
  </div>

  <p class="compte" id="compte">Chargement…</p>
  <div id="resultats"></div>
  <p class="maj" id="maj"></p>
</main>

<div id="sheet" class="sheet">
  <div class="sheet-inner" role="dialog" aria-modal="true">
    <button id="sheet-close" class="sheet-close" aria-label="Fermer">&#215;</button>
    <div id="sheet-body"></div>
  </div>
</div>

<script>
"use strict";

var BESOINS = [
  ["droits", "Ouvrir des droits"], ["medecin", "Médecin / consultation"], ["femme", "Santé femme"],
  ["enfant", "Enfant / PMI"], ["psy", "Santé psychique"], ["depistage", "Dépistage"],
  ["dents", "Dentaire"], ["pharmacie", "Pharmacie"], ["interprete", "Interprétariat"]
];
var ATTR_LABEL = {
  gratuit: "Gratuit", rdv: "Sur rendez-vous", sansrdv: "Sans rendez-vous",
  sansdroits: "Reçoit sans couverture", interprete: "Interprétariat sur place",
  enfants: "Accueil enfants", femmes: "Accueil femmes"
};
var DOC_LABEL = {
  identite: "pièce d'identité", attestation: "attestation de domicile ou de suivi",
  vitale: "carte Vitale", domicile: "justificatif de domicile", ordonnance: "ordonnance", aucun: "aucun document requis"
};

/* ---------- lexique ---------- */
var LEXIQUE = [
  { groupe: "Dispositif et statut", items: [
    { terme: "BPI", def: "Bénéficiaire de la Protection Internationale — personne ayant obtenu le statut de réfugié ou la protection subsidiaire." },
    { terme: "ACCSO", def: "Dispositif santé du Forum réfugiés dans lequel s'inscrit le poste de coordination thérapeutique.", att: "Sigle interne — expansion exacte à confirmer avec l'équipe" },
    { terme: "AGIR 31", def: "Dispositif d'accompagnement global des personnes réfugiées en Haute-Garonne, rattaché au programme national AGIR piloté par l'État.", att: "Détail du fonctionnement local à confirmer avec l'équipe" },
    { terme: "HUDA", def: "Hébergement d'Urgence pour Demandeurs d'Asile." },
    { terme: "CADA", def: "Centre d'Accueil de Demandeurs d'Asile." },
    { terme: "OFII", def: "Office Français de l'Immigration et de l'Intégration — organise notamment le rendez-vous santé obligatoire à l'arrivée en France." }
  ]},
  { groupe: "Couverture santé", items: [
    { terme: "PUMA", def: "Protection Universelle Maladie — prise en charge de base des frais de santé, ouverte selon la résidence en France." },
    { terme: "C2S", def: "Complémentaire Santé Solidaire — complémentaire gratuite ou à tarif réduit selon les ressources, a remplacé la CMU-C." },
    { terme: "CMU-C", def: "Ancien nom de la C2S — encore utilisé à l'oral et dans certains documents." },
    { terme: "AME", def: "Aide Médicale d'État — couverture santé pour les personnes en situation irrégulière ne pouvant pas ouvrir la PUMA." }
  ]},
  { groupe: "Structures de soins", items: [
    { terme: "PASS", def: "Permanence d'Accès aux Soins de Santé — consultations et accompagnement pour les personnes sans couverture ou avec des droits incomplets, adossées à un hôpital." },
    { terme: "CMP", def: "Centre Médico-Psychologique — consultations psychiatriques et psychologiques gratuites, sectorisées par zone d'habitation." },
    { terme: "CMPP", def: "Centre Médico-Psycho-Pédagogique — équivalent du CMP pour les enfants et adolescents, avec un volet pédagogique." },
    { terme: "CSAPA", def: "Centre de Soins, d'Accompagnement et de Prévention en Addictologie." },
    { terme: "CeGIDD", def: "Centre Gratuit d'Information, de Dépistage et de Diagnostic — VIH, hépatites, IST, gratuit et anonyme." },
    { terme: "CLAT", def: "Centre de Lutte AntiTuberculeuse — dépistage et suivi de la tuberculose." },
    { terme: "PMI", def: "Protection Maternelle et Infantile — suivi de grossesse et des enfants de moins de 6 ans, gratuit." },
    { terme: "CPEF", def: "Centre de Planification et d'Éducation Familiale — contraception, IVG, violences." },
    { terme: "CRPOc", def: "Centre Régional de Psychotraumatisme Occitanie — consultations spécialisées psychotraumatisme, y compris pour les personnes exilées." },
    { terme: "FINESS", def: "Fichier National des Établissements Sanitaires et Sociaux — répertoire officiel dont sont importées les 617 fiches automatiques de l'annuaire." }
  ]},
  { groupe: "Vocabulaire de l'appli", items: BESOINS.map(function (b) {
      return { terme: "Besoin — " + b[1], def: "Catégorie de filtre « " + b[0] + " » utilisée dans l'annuaire." };
    }).concat(Object.keys(ATTR_LABEL).map(function (k) {
      return { terme: "Attribut — " + ATTR_LABEL[k], def: "Tag « " + k + "  » affiché sur les fiches." };
    }))
  }
];

var ETAT = { besoin: null, zone: "", age: "", droits: "", texte: "", nonverifie: true };
var DATA = { structures: [], maj: "" };
var MODE = "direct";

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function telLien(n) { return "tel:" + String(n).replace(/\s/g, ""); }
function carteLien(adr) { return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(adr); }
function json(url) {
  return fetch(url, { cache: "no-cache" }).then(function (r) {
    if (!r.ok) throw new Error(url + " : " + r.status);
    return r.json();
  });
}

function rangeeBesoins() {
  var h = '<button class="puce" data-besoin="">Tous</button>';
  BESOINS.forEach(function (b) {
    h += '<button class="puce" data-besoin="' + b[0] + '">' + esc(b[1]) + '</button>';
  });
  document.getElementById("rangee-besoins").innerHTML = h;
}

function sansDroits(s) { return s.attributs.indexOf("sansdroits") !== -1; }

function filtrer() {
  var q = ETAT.texte.trim().toLowerCase();
  var liste = DATA.structures.filter(function (s) {
    if (ETAT.besoin && s.besoins.indexOf(ETAT.besoin) === -1) return false;
    if (ETAT.zone && s.zones.indexOf(ETAT.zone) === -1) return false;
    if (ETAT.age && s.ages.indexOf(ETAT.age) === -1) return false;
    if (!ETAT.nonverifie && s.verifie === false) return false;
    if (q && (s.nom + " " + s.adresse + " " + (s.note || "")).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  if (ETAT.droits === "non") liste = liste.filter(sansDroits);
  return liste.sort(function (x, y) {
    var a1 = x.source === "FINESS" ? 1 : 0, b1 = y.source === "FINESS" ? 1 : 0;
    if (a1 !== b1) return a1 - b1;
    if (ETAT.droits === "encours") {
      var a2 = sansDroits(x) ? 0 : 1, b2 = sansDroits(y) ? 0 : 1;
      if (a2 !== b2) return a2 - b2;
    }
    return x.nom.localeCompare(y.nom);
  });
}

function carte(s) {
  var badge = s.verifie === false
    ? '<span class="badge warn">à vérifier</span>'
    : '<span class="badge ok">vérifié</span>';
  var h = "<div class='carte'><h3>" + esc(s.nom) + badge + "</h3><p class='adr'>" + esc(s.adresse || "") +
    (s.transport ? "<br>" + esc(s.transport) : "") + "</p>";
  if (s.tel) h += "<p class='tel-ligne'><a href='" + telLien(s.tel) + "'>" + esc(s.tel) + "</a></p>";
  h += "<div class='tags'>" + (s.besoins || []).map(function (b) {
    var lbl = BESOINS.filter(function (x) { return x[0] === b; })[0];
    return "<span class='tag'>" + esc(lbl ? lbl[1] : b) + "</span>";
  }).join("") + (s.attributs || []).map(function (a) {
    return "<span class='tag " + (a === "rdv" ? "attention" : "oui") + "'>" + esc(ATTR_LABEL[a] || a) + "</span>";
  }).join("") + "</div>";
  if (s.note) h += "<p class='note-int'>" + esc(s.note) + "</p>";
  if (s.docs && s.docs.length) {
    h += "<p class='note-int'><strong>À demander d'apporter :</strong> " +
      s.docs.map(function (d) { return DOC_LABEL[d] || d; }).join(", ") + "</p>";
  }
  h += "<div class='actions'>" +
    (s.tel ? "<a class='btn' href='" + telLien(s.tel) + "'>Appeler</a>" : "") +
    (s.adresse ? "<a class='btn ghost' target='_blank' rel='noopener' href='" + carteLien(s.adresse) + "'>Itinéraire</a>" : "") +
    "</div></div>";
  return h;
}

function rendre() {
  var liste = filtrer();
  document.getElementById("compte").textContent = liste.length + " structure(s) correspondent au filtre.";
  document.getElementById("resultats").innerHTML = liste.length
    ? liste.map(carte).join("")
    : "<div class='carte'><p>Aucune structure ne correspond à ces critères.</p></div>";
  document.querySelectorAll(".puce[data-besoin]").forEach(function (btn) {
    btn.classList.toggle("actif", btn.getAttribute("data-besoin") === ETAT.besoin);
  });
}

function syncFiltresDirects() {
  document.getElementById("f-zone").value = ETAT.zone;
  document.getElementById("f-age").value = ETAT.age;
  document.getElementById("f-droits").value = ETAT.droits;
}

document.getElementById("rangee-besoins").addEventListener("click", function (e) {
  var btn = e.target.closest("[data-besoin]");
  if (!btn) return;
  ETAT.besoin = btn.getAttribute("data-besoin");
  rendre();
});
document.getElementById("f-zone").addEventListener("change", function (e) { ETAT.zone = e.target.value; rendre(); });
document.getElementById("f-age").addEventListener("change", function (e) { ETAT.age = e.target.value; rendre(); });
document.getElementById("f-droits").addEventListener("change", function (e) { ETAT.droits = e.target.value; rendre(); });
document.getElementById("f-nonverifie").addEventListener("change", function (e) { ETAT.nonverifie = e.target.checked; rendre(); });
document.getElementById("recherche-texte").addEventListener("input", function (e) { ETAT.texte = e.target.value; rendre(); });

/* ---------- questionnaire en entonnoir ---------- */
var ETAPES = {
  intro: {
    titre: "Quelle est la nature principale de la difficulté repérée ?",
    choix: [
      { label: "Accès aux soins bloqué — pas de médecin, pas de suivi", next: "acces" },
      { label: "Psychisme — moral, sommeil, événements vécus, souffrance psychique", besoin: "psy" },
      { label: "Démarche administrative de couverture santé (droits, PUMA, C2S, AME)", besoin: "droits" },
      { label: "Besoin d'un interprète pour un rendez-vous", besoin: "interprete" },
      { label: "Santé d'un enfant ou question PMI", besoin: "enfant", age: "a" },
      { label: "Grossesse, contraception, gynécologie, violences", besoin: "femme" },
      { label: "Dépistage ou bilan de prévention (IST, tuberculose…)", besoin: "depistage" },
      { label: "Problème dentaire", besoin: "dents" },
      { label: "Médicament à obtenir", besoin: "pharmacie" },
      { label: "Plusieurs difficultés à la fois, ou pas encore clair", besoin: "", note: true }
    ]
  },
  acces: {
    titre: "La couverture santé de la personne est-elle ouverte (carte Vitale active) ?",
    retourVers: "intro",
    choix: [
      { label: "Oui, les droits sont ouverts", besoin: "medecin", droits: "oui" },
      { label: "Une demande est en cours", besoin: "medecin", droits: "encours" },
      { label: "Non, ou je ne sais pas", besoin: "medecin", droits: "non" }
    ]
  }
};
var ETAPE_ACTUELLE = "intro";
var HISTO_ETAPES = [];

function rendreEtape() {
  var e = ETAPES[ETAPE_ACTUELLE];
  var filH = HISTO_ETAPES.length
    ? '<button id="fil-recommencer">Recommencer le questionnaire</button>'
    : "Première question";
  document.getElementById("fil-etapes").innerHTML = filH;
  var h = "<h2>" + esc(e.titre) + "</h2><div class='question-choix'>";
  e.choix.forEach(function (c, i) {
    h += '<button data-choix="' + i + '">' + esc(c.label) + "</button>";
  });
  h += "</div>";
  document.getElementById("question-carte").innerHTML = h;
  var recommencer = document.getElementById("fil-recommencer");
  if (recommencer) recommencer.addEventListener("click", function () {
    ETAPE_ACTUELLE = "intro"; HISTO_ETAPES = [];
    ETAT.besoin = null; ETAT.droits = ""; ETAT.age = "";
    rendreEtape(); rendre();
  });
}

document.getElementById("question-carte").addEventListener("click", function (e) {
  var btn = e.target.closest("[data-choix]");
  if (!btn) return;
  var etape = ETAPES[ETAPE_ACTUELLE];
  var choix = etape.choix[Number(btn.getAttribute("data-choix"))];
  if (choix.next) {
    HISTO_ETAPES.push(ETAPE_ACTUELLE);
    ETAPE_ACTUELLE = choix.next;
    rendreEtape();
    return;
  }
  ETAT.besoin = choix.besoin || null;
  if (choix.droits) ETAT.droits = choix.droits;
  if (choix.age) ETAT.age = choix.age;
  syncFiltresDirects();
  rendre();
  var msg = choix.note
    ? "<p class='note-int' style='margin-top:10px'>Passe plutôt par « Filtres directs » ci-dessus pour combiner plusieurs critères à la fois.</p>"
    : "";
  document.getElementById("question-carte").innerHTML +=
    "<p class='note-int' style='margin-top:14px'>Résultat affiché plus bas.</p>" + msg;
});

document.querySelectorAll(".mode-btn").forEach(function (btn) {
  btn.addEventListener("click", function () {
    MODE = btn.getAttribute("data-mode");
    document.querySelectorAll(".mode-btn").forEach(function (b) { b.classList.toggle("actif", b === btn); });
    document.getElementById("mode-direct").classList.toggle("masque", MODE === "guide");
    document.getElementById("mode-guide").classList.toggle("actif", MODE === "guide");
    if (MODE === "guide") { ETAPE_ACTUELLE = "intro"; HISTO_ETAPES = []; rendreEtape(); }
    else { syncFiltresDirects(); }
  });
});

/* ---------- lexique ---------- */
var sheet = document.getElementById("sheet");
var sheetBody = document.getElementById("sheet-body");
document.getElementById("sheet-close").addEventListener("click", fermerSheet);
sheet.addEventListener("click", function (e) { if (e.target === sheet) fermerSheet(); });
function fermerSheet() { sheet.classList.remove("ouvert"); sheetBody.innerHTML = ""; }
function ouvrirSheet(html) { sheetBody.innerHTML = html; sheet.classList.add("ouvert"); }

function contenuLexique(filtre) {
  var f = (filtre || "").toLowerCase();
  var h = '<input type="text" id="lex-recherche" placeholder="Chercher un terme…" value="' + esc(filtre || "") + '">';
  h += "<h1 style='font-size:20px'>Lexique</h1>";
  LEXIQUE.forEach(function (g) {
    var items = g.items.filter(function (it) {
      return !f || it.terme.toLowerCase().indexOf(f) !== -1 || it.def.toLowerCase().indexOf(f) !== -1;
    });
    if (!items.length) return;
    h += "<div class='lex-groupe'><h3>" + esc(g.groupe) + "</h3>";
    items.forEach(function (it) {
      h += "<div class='lex-item'><div class='terme'>" + esc(it.terme) + "</div><div class='def'>" + esc(it.def) + "</div>" +
        (it.att ? "<div class='att'>⚠ " + esc(it.att) + "</div>" : "") + "</div>";
    });
    h += "</div>";
  });
  return h;
}
document.getElementById("lexique-btn").addEventListener("click", function () {
  ouvrirSheet(contenuLexique(""));
  document.getElementById("lex-recherche").addEventListener("input", function (e) {
    var pos = e.target.selectionStart, val = e.target.value;
    sheetBody.innerHTML = contenuLexique(val);
    var champ = document.getElementById("lex-recherche");
    champ.focus(); champ.setSelectionRange(pos, pos);
  });
});

/* ---------- démarrage ---------- */
rangeeBesoins();
rendreEtape();
Promise.all([
  json("data/structures-31.json"),
  json("data/structures-finess-31.json").catch(function () { return { structures: [] }; })
]).then(function (r) {
  DATA.structures = r[0].structures.concat(r[1].structures || []);
  DATA.maj = r[0].maj;
  document.getElementById("maj").textContent = "Données à jour du " + DATA.maj + " — mêmes fichiers que l'appli patient.";
  rendre();
}).catch(function (err) {
  document.getElementById("resultats").innerHTML = "<div class='carte'><p>Les données n'ont pas pu être chargées : " +
    esc(err.message) + ". Ouvrez cette page via un serveur local (voir README), pas en double-cliquant dessus.</p></div>";
});
</script>
